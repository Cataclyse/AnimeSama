[package]
name = "animesama"
version = "0.1.0"
edition = "2021"
authors = ["Cataclyse"]
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:tao", "dep:wry"]

[dependencies]
tiny_http = "0.12"
tao = { version = "0.37", features = ["rwh_06"], optional = true }
wry = { version = "0.57", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
opener = "0.9"
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
