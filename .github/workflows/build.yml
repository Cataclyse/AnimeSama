name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI release binary
        run: |
          cargo build --release --features gui
          cp target/release/animesama animesama-linux-gui

      - name: Build Server Universal release binary
        run: |
          cargo build --release --no-default-features
          cp target/release/animesama animesama-linux-server

      - name: Package Debian Package
        run: |
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/metainfo deb/usr/share/icons/hicolor/256x256/apps
          cp animesama-linux-gui deb/usr/bin/animesama
          chmod 755 deb/usr/bin/animesama
          cp assets/icon.png deb/usr/share/icons/hicolor/256x256/apps/animesama.png

          cat << 'EOF' > deb/usr/share/applications/animesama.desktop
          [Desktop Entry]
          Name=Anime-Sama
          GenericName=Streaming Anime
          Comment=Streaming anime haute performance avec interface Netflix
          Exec=/usr/bin/animesama
          Icon=animesama
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Player;Network;
          Keywords=anime;streaming;manga;netflix;animesama;
          StartupWMClass=animesama
          EOF
          chmod 644 deb/usr/share/applications/animesama.desktop

          cat << 'EOF' > deb/usr/share/metainfo/animesama.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>animesama.desktop</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>Anime-Sama</name>
            <summary>Streaming anime avec interface cinématique inspirée de Netflix</summary>
            <description>
              <p>
                Anime-Sama Desktop est une application native ultra-rapide écrite en Rust offrant une expérience cinématographique moderne inspirée de Netflix pour explorer, planifier et regarder l'intégralité du catalogue Anime-Sama sans publicités invasives.
              </p>
              <p>Fonctionnalités principales :</p>
              <ul>
                <li>Hero Billboard dynamique avec séries en vedette et lecture de trailers au survol</li>
                <li>Rails de catégories horizontaux avec navigation fluide (Tendances, Derniers ajouts, Classiques)</li>
                <li>Lecteur cinéma intégré avec gestion des saisons, langues et épisodes</li>
                <li>Ad Shield intégré bloquant activement les redirections et publicités indésirables</li>
                <li>Système multilingue complet en 10 langues avec support des fichiers personnalisés</li>
                <li>Sauvegarde locale sécurisée respectant les standards XDG</li>
              </ul>
            </description>
            <launchable type="desktop-id">animesama.desktop</launchable>
            <screenshots>
              <screenshot type="default">
                <caption>Interface d'accueil Netflix avec Hero Billboard et rails</caption>
                <image>https://raw.githubusercontent.com/Cataclyse/AnimeSama/main/assets/preview.jpg</image>
              </screenshot>
              <screenshot>
                <caption>Fiche détaillée avec sélection des saisons et épisodes</caption>
                <image>https://raw.githubusercontent.com/Cataclyse/AnimeSama/main/assets/preview_modal.jpg</image>
              </screenshot>
            </screenshots>
            <url type="homepage">https://github.com/Cataclyse/AnimeSama</url>
            <url type="bugtracker">https://github.com/Cataclyse/AnimeSama/issues</url>
            <developer_name>Cataclyse</developer_name>
            <categories>
              <category>AudioVideo</category>
              <category>Video</category>
              <category>Player</category>
            </categories>
            <content_rating type="oars-1.1"/>
          </component>
          EOF
          chmod 644 deb/usr/share/metainfo/animesama.metainfo.xml

          cat << 'EOF' > deb/DEBIAN/control
          Package: animesama
          Version: 0.1.0
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: Cataclyse <contact@anime-sama.to>
          Homepage: https://github.com/Cataclyse/AnimeSama
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Description: Application desktop Anime-Sama avec interface Netflix
           Anime-Sama Desktop est une application native ultra-rapide écrite en Rust
           offrant une interface immersive inspirée de Netflix pour explorer, planifier
           et regarder l'intégralité du catalogue Anime-Sama sans publicités invasives.
           .
           Fonctionnalités :
            * Catalogue complet en temps réel issu d'Anime-Sama
            * Hero Billboard immersif avec bandes-annonces lues au survol
            * Rails horizontaux Netflix (Tendances, Derniers ajouts, Classiques)
            * Lecteur cinéma sans publicité avec choix des résolutions et lecteurs
            * Ad Shield intégré filtrant les redirections et publicités intrusives
            * 10 langues intégrées avec support des fichiers personnalisés (.lang)
            * Faible consommation de mémoire vive (< 40 Mo de RAM)
          EOF
          chmod 644 deb/DEBIAN/control

          dpkg-deb --build deb animesama_0.1.0_amd64.deb

      - name: Package Linux
        run: |
          mkdir -p dist-linux-gui dist-linux-server
          cp animesama-linux-gui dist-linux-gui/animesama
          cp -r static dist-linux-gui/
          tar -czf animesama-linux-gui-x86_64.tar.gz -C dist-linux-gui .

          cp animesama-linux-server dist-linux-server/animesama
          cp -r static dist-linux-server/
          tar -czf animesama-linux-server-x86_64.tar.gz -C dist-linux-server .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: animesama-linux
          path: |
            animesama-linux-gui
            animesama-linux-server
            animesama_0.1.0_amd64.deb
            animesama-linux-gui-x86_64.tar.gz
            animesama-linux-server-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item -Path target\release\animesama.exe -Destination dist-windows\
          Copy-Item -Recurse -Path static -Destination dist-windows\
          Compress-Archive -Path dist-windows\* -DestinationPath animesama-windows-x86_64.zip
          Copy-Item -Path target\release\animesama.exe -Destination animesama.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: animesama-windows
          path: |
            animesama-windows-x86_64.zip
            animesama.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: animesama-linux
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: animesama-windows
          path: release-assets

      - name: Determine tag name
        id: tag_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Anime-Sama Desktop (${{ steps.tag_name.outputs.tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/animesama_0.1.0_amd64.deb
            release-assets/animesama-linux-gui
            release-assets/animesama-linux-server
            release-assets/animesama-linux-gui-x86_64.tar.gz
            release-assets/animesama-linux-server-x86_64.tar.gz
            release-assets/animesama-windows-x86_64.zip
            release-assets/animesama.exe
