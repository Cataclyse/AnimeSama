name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            VERSION="0.1.${{ github.run_number }}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build-linux:
    name: Build Linux
    needs: [version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Cargo.toml version
        run: |
          sed -i 's/^version = .*/version = "'"$VERSION"'"/' Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI release binary
        run: |
          cargo build --release --features gui
          cp target/release/animesama animesama-linux-gui-x86_64
          chmod +x animesama-linux-gui-x86_64

      - name: Build Server Universal release binary
        run: |
          cargo build --release --no-default-features
          cp target/release/animesama animesama-linux-server-x86_64
          chmod +x animesama-linux-server-x86_64

      - name: Package Debian Package
        run: |
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/metainfo deb/usr/share/icons/hicolor/256x256/apps
          cp animesama-linux-gui-x86_64 deb/usr/bin/animesama
          chmod 755 deb/usr/bin/animesama
          cp assets/icon.png deb/usr/share/icons/hicolor/256x256/apps/animesama.png

          cat << 'EOF' > deb/usr/share/applications/animesama.desktop
          [Desktop Entry]
          Name=Anime-Sama
          GenericName=Streaming Anime
          Comment=Streaming anime haute performance avec interface Netflix
          Exec=/usr/bin/animesama
          Icon=animesama
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Player;Network;
          Keywords=anime;streaming;manga;netflix;animesama;
          StartupWMClass=animesama
          EOF
          chmod 644 deb/usr/share/applications/animesama.desktop

          cat << 'EOF' > deb/usr/share/metainfo/animesama.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>animesama.desktop</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>Anime-Sama</name>
            <summary>Streaming anime avec interface cinématique inspirée de Netflix</summary>
            <description>
              <p>
                Anime-Sama Desktop est une application native ultra-rapide écrite en Rust offrant une expérience cinématographique moderne inspirée de Netflix pour explorer, planifier et regarder l'intégralité du catalogue Anime-Sama sans publicités invasives.
              </p>
            </description>
            <launchable type="desktop-id">animesama.desktop</launchable>
            <url type="homepage">https://github.com/Cataclyse/AnimeSama</url>
            <url type="bugtracker">https://github.com/Cataclyse/AnimeSama/issues</url>
            <developer_name>Cataclyse</developer_name>
            <categories>
              <category>AudioVideo</category>
              <category>Video</category>
              <category>Player</category>
            </categories>
            <content_rating type="oars-1.1"/>
          </component>
          EOF
          chmod 644 deb/usr/share/metainfo/animesama.metainfo.xml

          cat << EOF > deb/DEBIAN/control
          Package: animesama
          Version: ${VERSION}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: Cataclyse <contact@anime-sama.to>
          Homepage: https://github.com/Cataclyse/AnimeSama
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Description: Application desktop Anime-Sama avec interface Netflix
           Anime-Sama Desktop est une application native ultra-rapide écrite en Rust
           offrant une interface immersive inspirée de Netflix pour explorer, planifier
           et regarder l'intégralité du catalogue Anime-Sama sans publicités invasives.
          EOF
          chmod 644 deb/DEBIAN/control

          dpkg-deb --build deb "animesama_${VERSION}_amd64.deb"

      - name: Package Linux Tarball
        run: |
          mkdir -p dist-linux
          cp animesama-linux-gui-x86_64 dist-linux/animesama
          cp assets/icon.png dist-linux/
          tar -czf animesama-linux-x86_64.tar.gz -C dist-linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: animesama-linux
          path: |
            animesama-linux-gui-x86_64
            animesama-linux-server-x86_64
            animesama_*_amd64.deb
            animesama-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    needs: [version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Cargo.toml version
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $newContent = $content -replace '(?m)^version = ".*?"', "version = `"$env:VERSION`""
          Set-Content Cargo.toml -Value $newContent

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build release binary
        run: cargo build --release

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            $isccPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          & $isccPath "/DMyAppVersion=$env:VERSION" installer.iss
          Move-Item dist-installer\AnimeSama-Setup-x86_64.exe AnimeSama-Setup-x86_64.exe

      - name: Package Windows Standalone
        shell: pwsh
        run: |
          Copy-Item -Path target\release\animesama.exe -Destination animesama-windows-x86_64.exe
          Copy-Item -Path target\release\animesama.exe -Destination animesama.exe
          New-Item -ItemType Directory -Force -Path dist-zip
          Copy-Item -Path target\release\animesama.exe -Destination dist-zip\
          Compress-Archive -Path dist-zip\* -DestinationPath animesama-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: animesama-windows
          path: |
            AnimeSama-Setup-x86_64.exe
            animesama-windows-x86_64.exe
            animesama.exe
            animesama-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: animesama-linux
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: animesama-windows
          path: release-assets

      - name: Generate Checksums & Release Notes
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat << 'EOF' > release_body.md
          Anime-Sama Desktop Release
          ==========================

          Installation Files
          ------------------

          - **Windows Installer**: `AnimeSama-Setup-x86_64.exe`
          - **Windows Standalone (Portable Onefile)**: `animesama-windows-x86_64.exe` (or `animesama.exe`)
          - **Windows Portable ZIP**: `animesama-windows-x86_64.zip`
          - **Debian / Ubuntu (.deb)**: `animesama_*_amd64.deb`
          - **Linux GUI Standalone (Portable Onefile)**: `animesama-linux-gui-x86_64`
          - **Linux Server Standalone (Headless)**: `animesama-linux-server-x86_64`
          - **Linux Portable Tarball**: `animesama-linux-x86_64.tar.gz`

          Checksums (SHA-256)
          -------------------

          | File | SHA-256 Checksum |
          | :--- | :--- |
          EOF

          while read -r hash file; do
            if [[ "$file" != "SHA256SUMS.txt" && "$file" != "release_body.md" ]]; then
              echo "| \`$file\` | \`$hash\` |" >> release_body.md
            fi
          done < SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Anime-Sama Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release-assets/release_body.md
          files: |
            release-assets/*
